<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kelime Defteri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
<style>
:root { color-scheme: dark; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<style>
:root {
  --bg: #edf0f5;
  --surface: #ffffff;
  --soft: #e3e8f1;
  --ink: #11172b;
  --muted: #566078;
  --line: #d3d9e5;
  --accent: #3347e0;
  --accent-ink: #ffffff;
  --mark: #ffe45c;
  --good: #1b7f52;
  --warn: #a85f00;
  --bad: #c23636;
  --font-display: "Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --font-body: "Inter", -apple-system, system-ui, sans-serif;
  --font-read: "Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1120; --surface: #171d33; --soft: #222a47; --ink: #eef1fa; --muted: #9aa3bd;
    --line: #2a3150; --accent: #8c9bff; --accent-ink: #0d1120; --mark: rgba(255, 214, 64, .34);
    --good: #4cc38a; --warn: #f0b34a; --bad: #ff8080;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1120; --surface: #171d33; --soft: #222a47; --ink: #eef1fa; --muted: #9aa3bd;
  --line: #2a3150; --accent: #8c9bff; --accent-ink: #0d1120; --mark: rgba(255, 214, 64, .34);
  --good: #4cc38a; --warn: #f0b34a; --bad: #ff8080;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 540px; margin: 0 auto; }
button, input, textarea { font-family: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 20px 14px; }
.top h1 { margin: 0; font: 700 26px/1.1 var(--font-display); letter-spacing: -.02em; }
.top .count { font-size: 14px; font-weight: 600; color: var(--muted); }

.view { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; min-width: 0; }
.muted { color: var(--muted); }
.center { text-align: center; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.meta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }

.word { margin: 10px 0 0; font: 700 clamp(34px, 10vw, 46px)/1.05 var(--font-display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.sentence { margin: 16px 0 0; font: 400 21px/1.5 var(--font-read); overflow-wrap: anywhere; }
mark {
  background: linear-gradient(transparent 52%, var(--mark) 52%);
  color: inherit; padding: 0 .08em; border-radius: 2px;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.back { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.meaning { margin: 6px 0 0; font: 600 22px/1.35 var(--font-display); color: var(--accent); overflow-wrap: anywhere; }

.btn { min-height: 52px; padding: 0 18px; border-radius: 14px; border: 1.5px solid transparent; font-size: 17px; font-weight: 600; cursor: pointer; }
.btn.block { width: 100%; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { min-height: 44px; font-size: 15px; padding: 0 14px; }

.rates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.rate.know { color: var(--good); }
.rate { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 64px; padding: 8px 2px; border-radius: 14px; border: 1.5px solid currentColor; background: var(--surface); font-size: 16px; font-weight: 600; cursor: pointer; }
.rate small { font-size: 12px; font-weight: 500; opacity: .85; }
.rate.again { color: var(--bad); }
.rate.hard { color: var(--warn); }
.rate.good { color: var(--accent); }
.rate.easy { color: var(--good); }

.form { display: grid; gap: 18px; }
.field { display: grid; gap: 7px; }
input[type="text"], input[type="search"], textarea {
  width: 100%; font-size: 17px; line-height: 1.4; padding: 13px 14px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
}
textarea { resize: vertical; min-height: 92px; font-family: var(--font-read); font-size: 18px; }
input:focus, textarea:focus { border-color: var(--accent); outline: none; }
.note { margin: 0; font-size: 14px; color: var(--muted); }
.note.err { color: var(--bad); }
.sentbox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px 14px; display: grid; gap: 4px; }
.sentbox .sentence { margin-top: 8px; font-size: 20px; }
.sentbox .actions { margin-top: 10px; display: flex; gap: 8px; }

.list { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.item { border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; padding: 10px 16px; cursor: pointer; }
.item summary::-webkit-details-marker { display: none; }
.sum { display: grid; min-width: 0; }
.sum b { font: 600 19px/1.2 var(--font-display); overflow-wrap: anywhere; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
.chip { flex: none; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.chip.due { background: var(--accent); color: var(--accent-ink); }
.chip.new { background: var(--mark); color: var(--ink); }
.detail { display: grid; gap: 12px; padding: 2px 16px 18px; }
.detail .sentence { margin: 0; font-size: 19px; }
.detail .row { display: flex; flex-wrap: wrap; gap: 8px; }
.empty { padding: 26px 20px; }
.empty h2 { margin: 0 0 6px; font: 700 22px/1.2 var(--font-display); }
.empty p { margin: 0 0 16px; color: var(--muted); }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
}
.tab { display: grid; justify-items: center; gap: 2px; min-height: 52px; padding: 4px 0; background: none; border: 0; border-radius: 12px; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
.tab[aria-current="page"] { color: var(--accent); }

.defn { margin: 0; font-weight: 500; color: var(--accent); overflow-wrap: anywhere; }
.added .word { font-size: 30px; }
.added .defn { margin-top: 12px; }
.added .row { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 6; max-width: calc(100% - 32px); padding: 11px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 500; text-align: center; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 12px; background: var(--soft); }
.segbtn { min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 15px; font-weight: 600; cursor: pointer; }
.segbtn[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.wchip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; }
.ygbox { padding: 12px; overflow: hidden; display: grid; gap: 10px; }
#yg-widget { min-height: 40px; max-width: 100%; overflow: hidden; }
.out { color: var(--accent); font-weight: 600; }
.ctl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ctlbtn { min-height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; }
#gBody { min-height: 150px; }
.gbtns { display: grid; grid-template-columns: 1fr; gap: 8px; }
.gbtns.edit { grid-template-columns: 2fr 1fr; }
.gbody { margin: 0; font: 400 18px/1.6 var(--font-read); white-space: pre-wrap; overflow-wrap: anywhere; }
.gprev { font-size: 14px; }
.wordrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 10px; }
.wordrow .word { margin: 0; }
.pron { display: flex; align-items: center; gap: 6px; }
.pbtn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--accent); font-size: 13px; font-weight: 700; text-decoration: none; cursor: pointer; }
.pbtn.ico { width: 40px; padding: 0; color: var(--muted); }
.pbtn:hover { background: var(--soft); }
.ipa { margin: 4px 0 0; font-size: 15px; color: var(--muted); }
.ipa:empty { display: none; }
#studyBody { display: grid; gap: 14px; }
.searchbox { display: grid; gap: 8px; }
.results { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.rs { display: grid; gap: 2px; width: 100%; min-height: 52px; padding: 8px 14px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); cursor: pointer; }
.rs:last-child { border-bottom: 0; }
.rs b { font: 600 17px/1.2 var(--font-display); }
.rs span { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rs:hover, .rs:focus-visible { background: var(--soft); }
.results .empty { padding: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Kelime Defteri</h1>
    <span class="count" id="count"></span>
  </header>

  <main>
    <section id="v-telaffuz" class="view" aria-label="Telaffuz" hidden>
      <div class="card form">
        <div class="field">
          <label class="label" for="ygWord">Kelime</label>
          <input id="ygWord" type="text" placeholder="ör. see" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
          <p class="note">Kelimenin gerçek konuşmalarda nasıl söylendiğini YouGlish videolarından dinle.</p>
        </div>
        <div class="seg" role="group" aria-label="Aksan">
          <button class="segbtn" type="button" data-accent="" aria-pressed="true">Hepsi</button>
          <button class="segbtn" type="button" data-accent="us" aria-pressed="false">ABD</button>
          <button class="segbtn" type="button" data-accent="uk" aria-pressed="false">İngiltere</button>
        </div>
        <button class="btn primary block" id="ygGo" type="button" disabled>Dinle</button>
        <div class="field">
          <label class="label" for="tSearch">Kayıtlı kelimelerde ara</label>
          <input id="tSearch" type="search" placeholder="Kelime ara" autocapitalize="none" autocomplete="off" spellcheck="false">
          <div id="tResults" class="results" hidden></div>
        </div>
      </div>
      <div class="card ygbox" id="ygBox" hidden>
        <div id="yg-widget"></div>
        <div class="ctl" id="ygCtl" role="group" aria-label="Video kontrolleri" hidden>
          <button class="ctlbtn" type="button" data-act="previous">‹ Önceki</button>
          <button class="ctlbtn" type="button" data-act="next">Sonraki ›</button>
          <button class="ctlbtn" type="button" data-act="replay">↺ Tekrar</button>
        </div>
        <p class="note" id="ygNote"></p>
        <a class="out" id="ygLink" href="https://youglish.com" target="_blank" rel="noopener noreferrer">YouGlish'te aç</a>
      </div>
    </section>

    <section id="v-calis" class="view" aria-label="Çalış">
      <div class="searchbox">
        <input id="sSearch" type="search" placeholder="Kayıtlı kelimelerde ara" autocapitalize="none" autocomplete="off" spellcheck="false" aria-label="Kelime ara">
        <div id="sResults" class="results" hidden></div>
      </div>
      <div id="studyBody"></div>
    </section>

    <section id="v-ekle" class="view" aria-label="Yeni kelime" hidden>
      <div class="card form">
        <div class="field">
          <label class="label" for="word">İngilizce kelime</label>
          <input id="word" type="text" placeholder="ör. see" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
          <p class="note" id="dup" hidden></p>
        </div>
        <div class="field" id="manual" hidden>
          <span class="label">Örnek cümle</span>
          <textarea id="sentEdit" rows="3" aria-label="Örnek cümle" autocapitalize="sentences" spellcheck="true"></textarea>
          <span class="label">Tanım (İngilizce)</span>
          <textarea id="defEdit" rows="2" aria-label="Tanım" autocapitalize="sentences" spellcheck="true"></textarea>
        </div>
        <div class="field">
          <button class="btn primary block" id="gen" type="button" disabled>Ekle</button>
          <p class="note err" id="err" hidden></p>
          <p class="note" id="offNote" hidden>Tanım ve örnek cümle ücretsiz bir sözlükten gelir. Bulunamazsa kendin yazabilirsin.</p>
        </div>
      </div>
      <div id="result" hidden></div>
    </section>

    <section id="v-kelimeler" class="view" aria-label="Kelimeler" hidden>
      <input id="search" type="search" placeholder="Kelime veya anlam ara" autocapitalize="none" autocomplete="off" spellcheck="false" aria-label="Ara">
      <p class="note" id="listnote"></p>
      <div id="list" class="list"></div>
    </section>
    <section id="v-grammar" class="view" aria-label="Grammar" hidden>
      <div class="card form">
        <div class="field">
          <label class="label" for="gTitle">Konu</label>
          <input id="gTitle" type="text" placeholder="ör. Present Perfect" autocapitalize="sentences" autocomplete="off" spellcheck="false" enterkeyhint="next">
        </div>
        <div class="field">
          <label class="label" for="gBody">Notların</label>
          <textarea id="gBody" rows="6" placeholder="Kuralı, örnek cümleleri, istisnaları yaz…" autocapitalize="sentences" spellcheck="true"></textarea>
        </div>
        <div class="gbtns" id="gBtns">
          <button class="btn primary" id="gSave" type="button" disabled>Kaydet</button>
          <button class="btn ghost" id="gCancel" type="button" hidden>Vazgeç</button>
        </div>
      </div>
      <input id="gSearch" type="search" placeholder="Notlarda ara" autocapitalize="none" autocomplete="off" spellcheck="false" aria-label="Grammar notlarında ara">
      <p class="note" id="gNote"></p>
      <div id="gList" class="list"></div>
    </section>
  </main>
</div>

<nav class="tabs" aria-label="Bölümler">
  <button class="tab" data-view="telaffuz" type="button">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 10v4h3l4 3.5v-11L8 10H5z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5M18.5 7a7 7 0 0 1 0 10"/></svg>
    <span>Telaffuz</span>
  </button>
  <button class="tab" data-view="calis" type="button">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 10h8M8 14h5"/></svg>
    <span>Çalış</span>
  </button>
  <button class="tab" data-view="ekle" type="button">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>
    <span>Ekle</span>
  </button>
  <button class="tab" data-view="kelimeler" type="button">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7h11M8 12h11M8 17h11"/><path d="M4.5 7h.01M4.5 12h.01M4.5 17h.01"/></svg>
    <span>Kelimeler</span>
  </button>
  <button class="tab" data-view="grammar" type="button">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5.5A1.5 1.5 0 0 1 6.5 4H19v14H6.5A1.5 1.5 0 0 0 5 19.5v-14z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 8.5h6M9 12h4"/></svg>
    <span>Grammar</span>
  </button>
</nav>
<div id="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";
  var LS = "kelime-defteri-v1", DAY = 864e5, MIN = 6e4, HR = 36e5;
  var $ = function (id) { return document.getElementById(id); };

  function h(tag, props) {
    var e = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (a) {
      var v = props[a];
      if (a === "class") e.className = v;
      else if (a.slice(0, 2) === "on") e.addEventListener(a.slice(2), v);
      else if (v === true) e.setAttribute(a, "");
      else if (v !== false && v != null) e.setAttribute(a, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      kids.forEach(function (k) { if (k != null && k !== false) e.append(k); });
    }
    return e;
  }

  /* ---------- state ---------- */
  var cards = [], loaded = false, slow = false;
  var mode = "pending", col = null;           // "db" | "local"
  var sample = null, sampleState = "pending"; // "ok" | "off"
  var learning = new Set(), openIds = new Set(), chain = {};
  var shownId = null, revealed = false, view = "calis", pinnedId = null;
  var genBusy = false;

  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  var toastTimer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2800);
  }

  /* ---------- scheduling (simple SM-2 variant) ---------- */
  function nextState(c, q) {
    var n = Object.assign({}, c), now = Date.now(), ease = c.ease || 2.5, iv = c.interval || 1, days;
    n.reviews = (c.reviews || 0) + 1;
    if (q === "again") {
      n.lapses = (c.lapses || 0) + 1; n.ease = Math.max(1.3, ease - 0.2);
      n.reps = 0; n.interval = 0; n.due = now + 10 * MIN; return n;
    }
    if (q === "know") {
      n.reps = (c.reps || 0) + 1; n.interval = 1 / 24; n.due = now + HR; return n;
    }
    if (q === "hard") { days = c.reps > 0 ? Math.max(1, iv * 1.2) : 1; n.ease = Math.max(1.3, ease - 0.15); }
    else if (q === "good") { days = c.reps === 0 ? 1 : c.reps === 1 ? 3 : Math.max(1, iv * ease); }
    else { days = c.reps === 0 ? 3 : c.reps === 1 ? 6 : Math.max(1, iv * ease * 1.3); n.ease = ease + 0.15; }
    n.reps = (c.reps || 0) + 1; n.interval = days; n.due = now + Math.round(days * DAY);
    return n;
  }
  function fmt(ms) {
    var m = Math.round(ms / MIN);
    if (m < 60) return Math.max(1, m) + " dk";
    var hr = Math.round(ms / HR);
    if (hr < 24) return hr + " sa";
    var d = Math.round(ms / DAY);
    return d < 30 ? d + " g" : Math.round(d / 30) + " ay";
  }

  /* ---------- storage ---------- */
  function persistLocal() { try { localStorage.setItem(LS, JSON.stringify(cards)); } catch (e) {} }
  function put(c) {
    var i = cards.findIndex(function (x) { return x.id === c.id; });
    if (i < 0) cards.push(c); else cards[i] = c;
  }
  function queueWrite(id, fn) {
    chain[id] = (chain[id] || Promise.resolve()).then(fn).catch(function () {
      toast("Kaydedilemedi. Bağlantını kontrol et.");
    });
  }
  function saveCard(c) {
    put(c);
    if (mode === "db") queueWrite(c.id, function () { return col.doc(c.id).set(c); });
    else persistLocal();
    refreshAll();
  }
  function removeCard(id) {
    cards = cards.filter(function (c) { return c.id !== id; });
    learning.delete(id); openIds.delete(id);

      : h("span", { class: "chip" }, fmt(c.due - now));
    d.append(h("summary", {}, h("div", { class: "sum" }, h("b", {}, c.word), h("span", { class: "muted ell" }, c.meaning)), chip));

    var regen = h("button", { class: "btn ghost small", type: "button", hidden: sampleState !== "ok" }, "Başka cümle");
    regen.addEventListener("click", function () { regenCard(c, regen); });
    var del = h("button", { class: "btn ghost small danger", type: "button" }, "Sil");
    var armed = false, tm;
    del.addEventListener("click", function () {
      if (!armed) {
        armed = true; del.textContent = "Emin misin? Sil";
        tm = setTimeout(function () { armed = false; del.textContent = "Sil"; }, 3500);
      } else { clearTimeout(tm); removeCard(c.id); }
    });
    var info = c.reviews
      ? c.reviews + " tekrar · sonraki: " + (c.due <= now ? "şimdi" : fmt(c.due - now) + " sonra")
      : "Henüz çalışılmadı";
    d.append(h("div", { class: "detail" },
      sentenceEl(c.sentence, c.used),
      h("p", { class: "defn" }, c.meaning),
      h("p", { class: "note" }, info),
      h("div", { class: "row" }, regen, del)));
    return d;
  }
  function updateList() {
    var root = $("list"), qv = $("search").value.trim().toLowerCase();
    var items = cards.filter(function (c) {
      return !qv || c.word.toLowerCase().indexOf(qv) >= 0 || c.meaning.toLowerCase().indexOf(qv) >= 0;
    }).sort(function (a, b) { return a.word.localeCompare(b.word, "en", { sensitivity: "base" }); });
    var note = cards.length ? cards.length + " kelime" : "";
    if (mode === "local") note += (note ? " · " : "") + "Kartlar yalnızca bu tarayıcıda saklanıyor.";
    $("listnote").textContent = note;
    root.hidden = !items.length && !cards.length;
    root.replaceChildren.apply(root, items.length ? items.map(itemEl)
      : cards.length ? [h("div", { class: "empty muted" }, "Eşleşen kelime yok.")] : []);
  }
  $("search").addEventListener("input", updateList);

  /* ---------- Telaffuz (YouGlish) ---------- */
  var ygIn = $("ygWord"), ygGo = $("ygGo"), ygWidget = null, ygState = "idle", ygAccent = "";

  function ygUpdate() { ygGo.disabled = !ygIn.value.trim(); }
  function ygLoad(cb) {
    if (window.YG && window.YG.Widget) { cb(true); return; }
    var done = false;
    function finish(ok) { if (!done) { done = true; cb(ok); } }
    window.onYouglishAPIReady = function () { finish(true); };
    var sc = document.createElement("script");
    sc.src = "https://youglish.com/public/emb/widget.js"; sc.async = true; sc.charset = "utf-8";
    sc.onerror = function () { finish(false); };
    document.head.appendChild(sc);
    setTimeout(function () { finish(!!(window.YG && window.YG.Widget)); }, 10000);
  }
  function ygDone(ev) { $("ygNote").textContent = ev && ev.totalResults === 0 ? "Bu kelime için sonuç bulunamadı." : ""; }
  function ygErr() { $("ygNote").textContent = "Video açılamadı. Aşağıdaki bağlantıdan YouGlish'te aç."; }
  function ygFetch() {
    var q = ygIn.value.trim();
    if (!q || !ygWidget) return;
    $("ygNote").textContent = "Yükleniyor…";
    $("ygCtl").hidden = false;
    try {
      if (ygAccent) ygWidget.fetch(q, "english", ygAccent); else ygWidget.fetch(q, "english");
    } catch (e) { ygErr(); }
  }
  function ygSearch() {
    var q = ygIn.value.trim();
    if (!q) return;
    $("ygBox").hidden = false;
    $("ygLink").href = "https://youglish.com/pronounce/" + encodeURIComponent(q) + "/english";
    $("ygNote").textContent = "Yükleniyor…";
    if (ygState === "loading") return;
    if (!ygWidget) {
      ygState = "loading";
      ygLoad(function (ok) {
        if (!ok) { ygState = "idle"; ygErr(); return; }
        ygState = "ready";
        var wd = Math.max(240, Math.min(560, $("ygBox").clientWidth - 24));
        ygWidget = new window.YG.Widget("yg-widget", { width: wd, events: { onFetchDone: ygDone, onError: ygErr } });
        ygFetch();
      });
      return;
    }
    ygFetch();
  }
  ygGo.addEventListener("click", ygSearch);
  ygIn.addEventListener("input", ygUpdate);
  ygIn.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); ygSearch(); } });
  document.querySelectorAll(".segbtn").forEach(function (b) {
    b.addEventListener("click", function () {
      ygAccent = b.dataset.accent || "";
      document.querySelectorAll(".segbtn").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      if (!$("ygBox").hidden) ygSearch();
    });
  });

  document.querySelectorAll(".ctlbtn").forEach(function (b) {
    b.addEventListener("click", function () {
      var act = b.dataset.act;
      try { if (ygWidget && typeof ygWidget[act] === "function") ygWidget[act](); } catch (e) {}
    });
  });

  /* ---------- Grammar ---------- */
  var LSG = "kelime-defteri-grammar-v1", gNotes = [], gEditId = null, gOpen = new Set();
  try { gNotes = JSON.parse(localStorage.getItem(LSG) || "[]"); } catch (e) { gNotes = []; }
  if (!Array.isArray(gNotes)) gNotes = [];
  var gTitle = $("gTitle"), gBody = $("gBody"), gSave = $("gSave"), gCancel = $("gCancel");

  function gPersist() { try { localStorage.setItem(LSG, JSON.stringify(gNotes)); } catch (e) { toast("Not kaydedilemedi."); } }
  function gUpdateBtn() {
    gSave.disabled = !(gTitle.value.trim() && gBody.value.trim());
    gSave.textContent = gEditId ? "Güncelle" : "Kaydet";
    gCancel.hidden = !gEditId;
    $("gBtns").className = gEditId ? "gbtns edit" : "gbtns";
  }
  function gReset() { gEditId = null; gTitle.value = ""; gBody.value = ""; gUpdateBtn(); }
  function gSaveNote() {
    var t = gTitle.value.trim(), b = gBody.value.trim(), now = Date.now();
    if (!t || !b) return;
    if (gEditId) {
      gNotes = gNotes.map(function (n) { return n.id === gEditId ? Object.assign({}, n, { title: t, body: b, updated: now }) : n; });
      toast("Not güncellendi");
    } else {
      gNotes.push({ id: newId(), title: t, body: b, created: now, updated: now });
      toast("Not eklendi");
    }
    gPersist(); gReset(); gRender();
  }
  function gItem(n) {
    var d = h("details", { class: "item", open: gOpen.has(n.id) });
    d.addEventListener("toggle", function () { if (d.open) gOpen.add(n.id); else gOpen.delete(n.id); });
    var first = n.body.split("\n")[0];
    d.append(h("summary", {}, h("div", { class: "sum" }, h("b", {}, n.title), h("span", { class: "muted ell gprev" }, first))));
    var edit = h("button", { class: "btn ghost small", type: "button" }, "Düzenle");
    edit.addEventListener("click", function () {
      gEditId = n.id; gTitle.value = n.title; gBody.value = n.body; gUpdateBtn();
      window.scrollTo(0, 0); toast("Düzenleme modu");
    });
    var del = h("button", { class: "btn ghost small danger", type: "button" }, "Sil");
    var armed = false, tm;
    del.addEventListener("click", function () {
      if (!armed) {
        armed = true; del.textContent = "Emin misin? Sil";
        tm = setTimeout(function () { armed = false; del.textContent = "Sil"; }, 3500);
      } else {
        clearTimeout(tm);
        gNotes = gNotes.filter(function (x) { return x.id !== n.id; });
        gOpen.delete(n.id);
        if (gEditId === n.id) gReset();
        gPersist(); gRender();
      }
    });
    d.append(h("div", { class: "detail" }, h("p", { class: "gbody" }, n.body), h("div", { class: "row" }, edit, del)));
    return d;
  }
  function gRender() {
    var root = $("gList"), qv = $("gSearch").value.trim().toLowerCase();
    var items = gNotes.filter(function (n) {
      return !qv || n.title.toLowerCase().indexOf(qv) >= 0 || n.body.toLowerCase().indexOf(qv) >= 0;
    }).sort(function (a, b) { return (b.updated || 0) - (a.updated || 0); });
    $("gNote").textContent = gNotes.length
      ? gNotes.length + " not · Notlar yalnızca bu tarayıcıda saklanıyor."
      : "Henüz notun yok. Yukarıya ilk grammar notunu yaz.";
    root.hidden = !gNotes.length;
    root.replaceChildren.apply(root, items.length ? items.map(gItem)
      : gNotes.length ? [h("div", { class: "empty muted" }, "Eşleşen not yok.")] : []);
  }
  gSave.addEventListener("click", gSaveNote);
  gCancel.addEventListener("click", gReset);
  gTitle.addEventListener("input", gUpdateBtn);
  gBody.addEventListener("input", gUpdateBtn);
  $("gSearch").addEventListener("input", gRender);

  /* ---------- shell ---------- */
  function updateHeader() {
    var now = Date.now();
    var n = cards.filter(function (c) { return c.due <= now; }).length;
    $("count").textContent = loaded && cards.length ? n + " bekliyor" : "";
  }
  function refreshAll() { updateHeader(); updateStudy(); updateList(); updateAdd(); renderResult(); renderStudySearch(); renderTSearch(); }

  var VIEWS = ["telaffuz", "calis", "ekle", "kelimeler", "grammar"];
  function setView(v, fromHash) {
    if (VIEWS.indexOf(v) < 0) v = "calis";
    view = v;
    VIEWS.forEach(function (n) { $("v-" + n).hidden = n !== v; });
    document.querySelectorAll(".tab").forEach(function (t) {
      if (t.dataset.view === v) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
    if (v === "calis") updateStudy();
    if (v === "kelimeler") updateList();
    if (v === "grammar") gRender();
    if (!fromHash) { try { if (location.hash.slice(1) !== v) location.hash = v; } catch (e) {} }
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".tab").forEach(function (t) {
    t.addEventListener("click", function () { setView(t.dataset.view); });
  });
  window.addEventListener("hashchange", function () {
    var v = location.hash.slice(1);
    if (VIEWS.indexOf(v) >= 0 && v !== view) setView(v, true);
  });

  /* ---------- startup ---------- */
  function initSample() {
    var c = window.claude;
    if (!c || !c.use) { sampleState = "off"; updateAdd(); return; }
    c.use("sample").then(function (fn) {
      sample = fn; sampleState = fn ? "ok" : "off";
    }, function () { sampleState = "off"; }).then(function () { updateAdd(); updateList(); renderResult(); });
  }
  async function initStore() {
    var c = window.claude;
    if (!c || !c.use) { startLocal(); return; }
    var timer = setTimeout(function () { slow = true; if (!loaded) updateStudy(); }, 10000);
    var uid = null, db = null;
    try {
      var user = await c.use("user");
      uid = user ? await user.id() : null;
      db = uid ? await c.use("db") : null;
    } catch (e) { db = null; }
    if (!db) { clearTimeout(timer); startLocal(); return; }
    mode = "db"; col = db.collection("data/users/" + uid);
    var unsub = col.onSnapshot(function (snap) {
      clearTimeout(timer); slow = false;
      cards = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      loaded = true; refreshAll();
    }, function () {
      clearTimeout(timer);
      try { unsub(); } catch (e) {}
      startLocal();
    });
  }

  setView((location.hash || "").slice(1) || "calis", true);
  refreshAll();
  gUpdateBtn();
  gRender();
  initSample();
  initStore();
})();
</script>
</body>
</html>
